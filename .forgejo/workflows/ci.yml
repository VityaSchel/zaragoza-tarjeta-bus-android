name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: tarjeta-bus-ci-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ["check", "hetzner"]
    timeout-minutes: 30
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      PR_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      WORKSPACE: /opt/tarjeta-bus-ci
      JAVA_HOME: /opt/jdk
      ANDROID_HOME: /opt/android-sdk
      GRADLE_USER_HOME: /opt/gradle-home
      GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.daemon=false
      JDK_RELEASE: "jdk-21.0.12.1+1"
      JDK_ARCHIVE: OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz
      JDK_SHA256: ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94
      CMDLINE_TOOLS_ARCHIVE: commandlinetools-linux-13114758_latest.zip
      CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
      GRADLE_WRAPPER_SHA256: 76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/head"
            want="$PR_HEAD_SHA"
          else
            ref="$FORGEJO_REF"
            want="$FORGEJO_SHA"
          fi

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
          [ -z "$want" ] || [ "$(git rev-parse HEAD)" = "$want" ] \
            || { echo "FATAL: head moved since the run was queued (want $want, got $(git rev-parse HEAD))"; exit 1; }

      - name: Install system packages
        run: |
          missing=()
          command -v unzip >/dev/null 2>&1 || missing+=(unzip)
          if [ ${#missing[@]} -gt 0 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Install the pinned JDK
        run: |
          curl -fsSLo /tmp/jdk.tar.gz \
            "https://github.com/adoptium/temurin21-binaries/releases/download/${JDK_RELEASE//+/%2B}/${JDK_ARCHIVE}"
          echo "${JDK_SHA256}  /tmp/jdk.tar.gz" | sha256sum -c -
          rm -rf "$JAVA_HOME"
          mkdir -p "$JAVA_HOME"
          tar xzf /tmp/jdk.tar.gz -C "$JAVA_HOME" --strip-components=1
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME/bin/java" -version

      - name: Install the pinned Android SDK
        run: |
          curl -fsSLo /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ARCHIVE}"
          echo "${CMDLINE_TOOLS_SHA256}  /tmp/cmdline-tools.zip" | sha256sum -c -
          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Verify the Gradle wrapper
        run: |
          cd "$WORKSPACE"
          echo "${GRADLE_WRAPPER_SHA256}  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Every version code must carry a changelog
        run: |
          cd "$WORKSPACE"
          code=$(sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          [ -n "$code" ] || { echo "FATAL: no versionCode in app/build.gradle.kts"; exit 1; }
          for locale in fastlane/metadata/android/*/; do
            entry="${locale}changelogs/${code}.txt"
            [ -s "$entry" ] || { echo "FATAL: version code $code has no changelog at $entry"; exit 1; }
          done
          echo "version code $code has a changelog in every locale"

      - name: Build
        run: cd "$WORKSPACE" && ./gradlew assembleDebug assembleRelease

      - name: Test
        run: cd "$WORKSPACE" && ./gradlew testDebugUnitTest

      - name: Lint
        run: cd "$WORKSPACE" && ./gradlew lintDebug
