name: F-Droid

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: tarjeta-bus-fdroid-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ["check", "hetzner"]
    timeout-minutes: 30
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      PR_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      WORKSPACE: /opt/tarjeta-bus-fdroid
      JAVA_HOME: /opt/jdk
      ANDROID_HOME: /opt/android-sdk
      GRADLE_USER_HOME: /opt/gradle-home
      GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.daemon=false
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/head"
            want="$PR_HEAD_SHA"
          else
            ref="$FORGEJO_REF"
            want="$FORGEJO_SHA"
          fi

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
          [ -z "$want" ] || [ "$(git rev-parse HEAD)" = "$want" ] \
            || { echo "FATAL: head moved since the run was queued (want $want, got $(git rev-parse HEAD))"; exit 1; }

      - name: Set up the pinned toolchain
        run: cd "$WORKSPACE" && ./ci/setup-android.sh

      - name: Install the F-Droid tooling
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends fdroidserver apksigcopier
          fdroid --version
          apksigcopier --version

      - name: F-Droid's scanner must accept the source
        run: cd "$WORKSPACE" && ./ci/fdroid-scan.sh

      - name: Build the unsigned release
        run: cd "$WORKSPACE" && ./gradlew :app:assembleRelease

      - name: A signature must transplant onto the unsigned build
        run: |
          cd "$WORKSPACE"
          store=$(mktemp -d)/throwaway.jks
          pass=$(head -c 18 /dev/urandom | base64)
          keytool -genkeypair -keystore "$store" -alias throwaway \
            -storepass "$pass" -keypass "$pass" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=throwaway, OU=ci, O=none, C=ZZ" >/dev/null

          cat > keystore.properties <<EOF
          storeFile=$store
          storePassword=$pass
          keyAlias=throwaway
          keyPassword=$pass
          EOF
          trap 'rm -f keystore.properties; rm -rf "$(dirname "$store")"' EXIT

          ./ci/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk
