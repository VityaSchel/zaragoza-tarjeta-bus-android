name: Reproducibility

on:
  workflow_dispatch:

concurrency:
  group: tarjeta-bus-reproducibility-${{ forgejo.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        provider: [hetzner, vultr]
    runs-on: ["build", "${{ matrix.provider }}"]
    timeout-minutes: 45
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      WORKSPACE: /opt/tarjeta-bus-build
      JAVA_HOME: /opt/jdk
      ANDROID_HOME: /opt/android-sdk
      GRADLE_USER_HOME: /opt/gradle-home
      GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.daemon=false
      TZ: UTC
      LC_ALL: C
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by build code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$FORGEJO_REF"
          git checkout -q FETCH_HEAD
          [ -z "$FORGEJO_SHA" ] || [ "$(git rev-parse HEAD)" = "$FORGEJO_SHA" ] \
            || { echo "FATAL: ref moved since the run was queued (want $FORGEJO_SHA, got $(git rev-parse HEAD))"; exit 1; }
          echo "building $FORGEJO_REF at $(git rev-parse HEAD) on ${{ matrix.provider }}"

      - name: Set up the pinned toolchain
        run: cd "$WORKSPACE" && ./ci/setup-android.sh

      - name: Build the unsigned release
        run: |
          cd "$WORKSPACE"
          [ ! -f keystore.properties ] || { echo "FATAL: a keystore would make this build uncomparable"; exit 1; }
          ./gradlew assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/
          sha256sum out/app-release-unsigned.apk

      - name: Upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: tarjeta-bus-unsigned-${{ matrix.provider }}
          path: /opt/tarjeta-bus-build/out/
          retention-days: 1

  compare:
    needs: [build]
    if: '!cancelled() && needs.build.result != ''failure'''
    runs-on: ["check", "hetzner"]
    timeout-minutes: 10
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PROVIDERS: 2
    steps:
      - name: Download the builds
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: dl

      - name: Compare
        run: |
          apks=(dl/tarjeta-bus-unsigned-*/app-release-unsigned.apk)
          [ "${#apks[@]}" -eq "$PROVIDERS" ] \
            || { echo "FATAL: expected $PROVIDERS builds, got ${#apks[@]}"; exit 1; }
          sha256sum "${apks[@]}"
          distinct=$(sha256sum "${apks[@]}" | awk '{print $1}' | sort -u | wc -l)
          [ "$distinct" -eq 1 ] \
            || { echo "FATAL: the providers did not produce the same APK"; exit 1; }
          echo "reproducible across $PROVIDERS providers"
